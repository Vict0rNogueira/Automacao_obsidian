<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>StudyBrain</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container">

    <div class="header">

        <h1>StudyBrain</h1>

        <p>
            IA + Obsidian + NotebookLM
        </p>

    </div>

    <form method="POST">

        <div id="campos">

            <!-- BLOCO -->

            <div class="bloco">

                <select name="materia" required>

                    <option value="">
                        Escolha a matéria
                    </option>

                    <option value="Administrativo">
                        Administrativo
                    </option>

                    <option value="Constitucional">
                        Constitucional
                    </option>

                    <option value="Direito Civil">
                        Direito Civil
                    </option>

                    <option value="Direito Penal">
                        Direito Penal
                    </option>

                    <option value="Legislação">
                        Legislação
                    </option>

                    <option value="Português">
                        Português
                    </option>

                    <option value="Processual Penal">
                        Processual Penal
                    </option>

                    <option value="RLM">
                        RLM
                    </option>

                </select>

                <input
                    type="text"
                    name="conteudo"
                    placeholder="Conteúdo"
                    required
                >

                <input
                    type="text"
                    name="notebooklm"
                    placeholder="Link do NotebookLM"
                >

                <textarea
                    name="texto"
                    rows="10"
                    placeholder="Cole aqui o resumo ou transcript do NotebookLM..."
                ></textarea>

            </div>

        </div>

        <!-- BOTÕES -->

        <div class="buttons">

            <button
                type="button"
                onclick="adicionarCampo()"
                class="btn-add"
            >
                + Adicionar Matéria
            </button>

            <button
                type="submit"
                class="btn-submit"
            >
                Gerar Arquivos
            </button>

        </div>

    </form>

</div>

<!-- SCRIPT -->

<script>

function adicionarCampo() {

    const bloco = document.createElement("div")

    bloco.classList.add("bloco")

    bloco.innerHTML = `

        <select name="materia" required>

            <option value="">
                Escolha a matéria
            </option>

            <option value="Administrativo">
                Administrativo
            </option>

            <option value="Constitucional">
                Constitucional
            </option>

            <option value="Direito Civil">
                Direito Civil
            </option>

            <option value="Direito Penal">
                Direito Penal
            </option>

            <option value="Legislação">
                Legislação
            </option>

            <option value="Português">
                Português
            </option>

            <option value="Processual Penal">
                Processual Penal
            </option>

            <option value="RLM">
                RLM
            </option>

        </select>

        <input
            type="text"
            name="conteudo"
            placeholder="Conteúdo"
            required
        >

        <input
            type="text"
            name="notebooklm"
            placeholder="Link do NotebookLM"
        >

        <textarea
            name="texto"
            rows="10"
            placeholder="Cole aqui o texto do NotebookLM..."
        ></textarea>

    `

    document
        .getElementById("campos")
        .appendChild(bloco)
}

</script>

</body>
</html>
